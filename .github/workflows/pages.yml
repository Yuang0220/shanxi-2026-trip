name: Deploy Shanxi Travel Guide

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build final static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets

          cp index.html with-images.html text-only.html weather-progressive.js _site/
          [ ! -f favicon.svg ] || cp favicon.svg _site/
          [ ! -f 404.html ] || cp 404.html _site/
          cp -R assets/images _site/assets/images

          test -s _site/with-images.html
          test "$(find _site/assets/images -type f | wc -l)" -ge 16
          test -s _site/assets/images/yingxian-muta-01.webp
          test -s _site/assets/images/yingxian-muta-02.webp
          test -s _site/assets/images/xuankongsi-01.webp
          test -s _site/assets/images/xuankongsi-02.webp
          test -s _site/assets/images/jinci-01.webp
          test -s _site/assets/images/jinci-02.webp
          test -s _site/assets/images/wangjia-dayuan-01.webp
          test -s _site/assets/images/hukou-01.webp
          test -s _site/assets/images/shanxi-noodles-01.webp

          grep -q 'gallery-928' _site/with-images.html
          grep -q 'gallery-929' _site/with-images.html
          grep -q 'gallery-101' _site/with-images.html
          grep -q 'weather-progressive.js' _site/with-images.html
          grep -q '当前天气参考' _site/with-images.html
          grep -q 'assets/images/xuankongsi-02.webp' _site/with-images.html
          ! grep -q 'data:image' _site/with-images.html
          ! grep -q 'commons.wikimedia.org' _site/with-images.html

      - name: Responsive layout smoke test
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          echo "Using $CHROME"

          cat > _site/__audit.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><title>AUDIT_RUNNING</title></head><body><pre id="results"></pre><script>
          const widths=[1440,1200,980,430,390,375];
          const results=[];
          const fail=m=>results.push('FAIL '+m);
          const pass=m=>results.push('PASS '+m);
          function inspect(width){return new Promise(resolve=>{
            const frame=document.createElement('iframe');
            frame.style.cssText=`position:absolute;left:-20000px;top:0;width:${width}px;height:1400px;border:0`;
            frame.src=`with-images.html?layout-audit=${width}`;
            frame.onload=()=>setTimeout(()=>{
              try{
                const doc=frame.contentDocument, win=frame.contentWindow;
                const viewport=win.innerWidth, scroll=doc.documentElement.scrollWidth;
                if(scroll>viewport+1) fail(`${width}: horizontal overflow ${scroll}>${viewport}`);

                const imgs=[...doc.images];
                if(imgs.length<14) fail(`${width}: only ${imgs.length} images`);
                const broken=imgs.filter(img=>!img.complete || img.naturalWidth===0);
                if(broken.length) fail(`${width}: ${broken.length} broken images`);

                if(doc.querySelectorAll('#stay tbody tr').length<7) fail(`${width}: hotel rows missing`);
                if(doc.querySelectorAll('#food tbody tr').length<4) fail(`${width}: food rows missing`);
                if(doc.querySelectorAll('.weather-grid .place').length<10) fail(`${width}: weather rows missing`);
                if(!doc.querySelector('.gallery-928')) fail(`${width}: 9/28 gallery missing`);
                if(!doc.querySelector('.gallery-929')) fail(`${width}: 9/29 gallery missing`);
                if(!doc.querySelector('.gallery-101')) fail(`${width}: 10/1 gallery missing`);

                const font=parseFloat(getComputedStyle(doc.body).fontSize);
                if(font<15) fail(`${width}: body font too small (${font}px)`);

                if(width>760){
                  const g928=doc.querySelector('.gallery-928');
                  const stacks=g928?[...g928.children]:[];
                  if(stacks.length===2){
                    const ws=stacks.map(x=>x.getBoundingClientRect().width);
                    if(Math.abs(ws[0]-ws[1])>4) fail(`${width}: 9/28 columns uneven ${ws.join('/')}`);
                  }
                  for(const selector of ['.gallery-929','.gallery-101']){
                    const figures=[...doc.querySelectorAll(`${selector} > figure`)];
                    if(figures.length===3){
                      const ws=figures.map(x=>x.getBoundingClientRect().width);
                      if(Math.max(...ws)-Math.min(...ws)>4) fail(`${width}: ${selector} columns uneven ${ws.join('/')}`);
                    }
                  }
                }
                pass(`${width}: viewport=${viewport}, scroll=${scroll}, images=${imgs.length}`);
              }catch(e){fail(`${width}: ${e.message}`)}
              frame.remove();resolve();
            },800);
            document.body.append(frame);
          })}
          (async()=>{
            for(const width of widths) await inspect(width);
            document.getElementById('results').textContent=results.join('\n');
            document.title=results.some(x=>x.startsWith('FAIL'))?'AUDIT_FAIL':'AUDIT_OK';
          })();
          </script></body></html>
          EOF

          python3 -m http.server 4173 --directory _site >/tmp/shanxi-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=20000 --dump-dom http://127.0.0.1:4173/__audit.html > /tmp/layout-audit.html
          grep -q '<title>AUDIT_OK</title>' /tmp/layout-audit.html
          ! grep -q 'FAIL ' /tmp/layout-audit.html
          sed -n '/PASS /p' /tmp/layout-audit.html
          rm _site/__audit.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed files
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          fetch_live(){
            local path="$1" out="$2"
            curl --fail --location --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors \
              "${PAGE_URL}${path}?build=${GITHUB_SHA}" -o "$out"
          }

          fetch_live index.html /tmp/live-index.html
          fetch_live with-images.html /tmp/live-with-images.html
          fetch_live text-only.html /tmp/live-text-only.html
          fetch_live assets/images/xuankongsi-01.webp /tmp/live-xuankongsi.webp
          fetch_live assets/images/yingxian-muta-01.webp /tmp/live-muta.webp
          fetch_live assets/images/hukou-01.webp /tmp/live-hukou.webp

          cmp _site/index.html /tmp/live-index.html
          cmp _site/with-images.html /tmp/live-with-images.html
          cmp _site/text-only.html /tmp/live-text-only.html
          cmp _site/assets/images/xuankongsi-01.webp /tmp/live-xuankongsi.webp
          cmp _site/assets/images/yingxian-muta-01.webp /tmp/live-muta.webp
          cmp _site/assets/images/hukou-01.webp /tmp/live-hukou.webp

          grep -q '9/28' /tmp/live-with-images.html
          grep -q '当前天气参考' /tmp/live-with-images.html
          grep -q 'gallery-928' /tmp/live-with-images.html
          grep -q 'gallery-929' /tmp/live-with-images.html
          grep -q 'gallery-101' /tmp/live-with-images.html
          ! grep -q 'commons.wikimedia.org' /tmp/live-with-images.html
          echo "LIVE_OK ${PAGE_URL}"
