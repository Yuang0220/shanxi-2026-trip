name: Deploy Shanxi Travel Guide

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import V7 high-resolution assets once
        if: ${{ hashFiles('.v7-assets-imported') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          URL='https://1drv.ms/u/c/D829AC4D92B78E50/IQD46cp8ndUZQZcGnrKa7tV8AevxfItifUF2xqFlcH4DMxY?download=1'
          curl --fail --location --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors \
            -A 'Mozilla/5.0' "$URL" -o /tmp/shanxi-v7.zip
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/shanxi-v7.zip')
          print('downloaded bytes:',p.stat().st_size)
          if p.read_bytes()[:2] != b'PK':
              raise SystemExit('Bootstrap download is not a ZIP file')
          PY
          unzip -t /tmp/shanxi-v7.zip >/dev/null
          rm -rf /tmp/shanxi-v7
          mkdir -p /tmp/shanxi-v7
          unzip -q /tmp/shanxi-v7.zip -d /tmp/shanxi-v7

          rm -rf .site-src assets/curated assets/images
          rm -f weather.js weather-rich.js
          mkdir -p assets/images
          cp -a /tmp/shanxi-v7/assets/images/. assets/images/
          cp /tmp/shanxi-v7/with-images.html with-images.html
          cp /tmp/shanxi-v7/weather-progressive.js weather-progressive.js
          cp /tmp/shanxi-v7/index.html index.html
          cp /tmp/shanxi-v7/text-only.html text-only.html
          cp /tmp/shanxi-v7/README-部署说明.txt README-部署说明.txt
          touch .v7-assets-imported

          test "$(find assets/images -type f | wc -l)" -ge 16
          test -s assets/images/xuankongsi-01.webp
          test -s assets/images/yingxian-muta-01.webp
          test -s assets/images/jinci-01.webp
          test -s assets/images/hukou-01.webp

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import V7 high-resolution travel guide assets'
            git push origin HEAD:main
          fi

      - name: Build final static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html with-images.html weather-progressive.js _site/
          cp text-only.html _site/
          if [ -f favicon.svg ]; then cp favicon.svg _site/; fi
          if [ -f 404.html ]; then cp 404.html _site/; fi
          mkdir -p _site/assets
          cp -R assets/images _site/assets/images

          test -s _site/with-images.html
          test "$(find _site/assets/images -type f | wc -l)" -ge 16
          test -s _site/assets/images/yingxian-muta-01.webp
          test -s _site/assets/images/yingxian-muta-02.webp
          test -s _site/assets/images/xuankongsi-01.webp
          test -s _site/assets/images/xuankongsi-02.webp
          test -s _site/assets/images/jinci-01.webp
          test -s _site/assets/images/hukou-01.webp
          grep -q 'gallery-928' _site/with-images.html
          grep -q 'gallery-929' _site/with-images.html
          grep -q 'gallery-101' _site/with-images.html
          grep -q 'weather-progressive.js' _site/with-images.html
          grep -q 'assets/images/xuankongsi-02.webp' _site/with-images.html
          ! grep -q 'data:image' _site/with-images.html
          ! grep -q 'commons.wikimedia.org' _site/with-images.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages build
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          fetch_live() {
            local path="$1" out="$2"
            curl --fail --location --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors \
              "${PAGE_URL}${path}?sha=${GITHUB_SHA}" -o "$out"
          }
          fetch_live with-images.html /tmp/live-with-images.html
          fetch_live assets/images/xuankongsi-01.webp /tmp/live-xuankongsi.webp
          fetch_live assets/images/yingxian-muta-01.webp /tmp/live-muta.webp
          fetch_live assets/images/hukou-01.webp /tmp/live-hukou.webp

          cmp _site/with-images.html /tmp/live-with-images.html
          test "$(stat -c%s /tmp/live-xuankongsi.webp)" -gt 500000
          test "$(stat -c%s /tmp/live-muta.webp)" -gt 300000
          test "$(stat -c%s /tmp/live-hukou.webp)" -gt 250000
          grep -q '9/28' /tmp/live-with-images.html
          grep -q '当前天气参考' /tmp/live-with-images.html
          grep -q 'gallery-928' /tmp/live-with-images.html
          echo "LIVE_OK ${PAGE_URL}"
